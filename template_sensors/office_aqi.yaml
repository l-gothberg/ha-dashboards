# Combined US EPA AQI from PM2.5 + PM10 (takes the higher of the two)
- sensor:
    - name: "Office AQI"
      unique_id: office_aqi_combined
      unit_of_measurement: "AQI"
      state_class: measurement
      icon: mdi:air-filter
      state: >
        {% set pm25 = states('sensor.leo_s_office_airgradient_sensor_pm2_5') | float(none) %}
        {% set pm10 = states('sensor.leo_s_office_airgradient_sensor_pm10') | float(none) %}

        {% macro aqi_pm25(c) %}
          {% set pm = (c * 10) | int / 10 %}
          {% if pm <= 9.0 %}
            {{ (((50 - 0) / (9.0 - 0.0)) * (pm - 0.0) + 0) | round(0) }}
          {% elif pm <= 35.4 %}
            {{ (((100 - 51) / (35.4 - 9.1)) * (pm - 9.1) + 51) | round(0) }}
          {% elif pm <= 55.4 %}
            {{ (((150 - 101) / (55.4 - 35.5)) * (pm - 35.5) + 101) | round(0) }}
          {% elif pm <= 125.4 %}
            {{ (((200 - 151) / (125.4 - 55.5)) * (pm - 55.5) + 151) | round(0) }}
          {% elif pm <= 225.4 %}
            {{ (((300 - 201) / (225.4 - 125.5)) * (pm - 125.5) + 201) | round(0) }}
          {% elif pm <= 325.4 %}
            {{ (((400 - 301) / (325.4 - 225.5)) * (pm - 225.5) + 301) | round(0) }}
          {% elif pm <= 500.4 %}
            {{ (((500 - 401) / (500.4 - 325.5)) * (pm - 325.5) + 401) | round(0) }}
          {% else %}
            500
          {% endif %}
        {% endmacro %}

        {% macro aqi_pm10(c) %}
          {% set pm = c | int %}
          {% if pm <= 54 %}
            {{ (((50 - 0) / (54 - 0)) * (pm - 0) + 0) | round(0) }}
          {% elif pm <= 154 %}
            {{ (((100 - 51) / (154 - 55)) * (pm - 55) + 51) | round(0) }}
          {% elif pm <= 254 %}
            {{ (((150 - 101) / (254 - 155)) * (pm - 155) + 101) | round(0) }}
          {% elif pm <= 354 %}
            {{ (((200 - 151) / (354 - 255)) * (pm - 255) + 151) | round(0) }}
          {% elif pm <= 424 %}
            {{ (((300 - 201) / (424 - 355)) * (pm - 355) + 201) | round(0) }}
          {% elif pm <= 504 %}
            {{ (((400 - 301) / (504 - 425)) * (pm - 425) + 301) | round(0) }}
          {% elif pm <= 604 %}
            {{ (((500 - 401) / (604 - 505)) * (pm - 505) + 401) | round(0) }}
          {% else %}
            500
          {% endif %}
        {% endmacro %}

        {% if pm25 is none and pm10 is none %}
          unknown
        {% else %}
          {% set aqi25 = aqi_pm25(pm25) | int if pm25 is not none else 0 %}
          {% set aqi10 = aqi_pm10(pm10) | int if pm10 is not none else 0 %}
          {{ [aqi25, aqi10] | max }}
        {% endif %}
