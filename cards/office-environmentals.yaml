type: custom:apexcharts-card
header:
  title: Office Environmentals
  show: true
  show_states: true
  colorize_states: true
graph_span: 24h
all_series_config:
  stroke_width: 2
  curve: smooth
  group_by:
    func: avg
    duration: 15min
apex_config:
  legend:
    show: false
  yaxis:
    - softMin: 400
      softMax: 800
    - {}
    - {}
series:
  - entity: sensor.leo_s_office_airgradient_sensor_carbon_dioxide
    name: CO₂
    yaxis_id: co2
    color: "#3498db"
  - entity: sensor.office_aqi
    name: AQI
    yaxis_id: aqi
    color: "#e74c3c"
  - entity: sensor.leo_s_office_airgradient_sensor_voc_index
    name: VOCs
    yaxis_id: vocs
    color: "#f1c40f"
yaxis:
  - id: co2
    show: true
    opposite: false
    decimals: 0
  - id: aqi
    show: true
    opposite: false
    decimals: 0
  - id: vocs
    show: true
    opposite: true
    decimals: 0
