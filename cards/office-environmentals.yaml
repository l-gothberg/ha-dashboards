type: custom:apexcharts-card
header:
  title: Office Environmentals
  show: true
  show_states: true
  colorize_states: true
graph_span: 4h
all_series_config:
  stroke_width: 1
series:
  - entity: sensor.leo_s_office_airgradient_sensor_carbon_dioxide
    name: CO₂
    yaxis_id: co2
    color: "#3498db"
  - entity: sensor.leo_s_office_airgradient_sensor_pm2_5
    name: PM2.5
    yaxis_id: pm25
    color: "#e74c3c"
  - entity: sensor.leo_s_office_airgradient_sensor_voc_index
    name: VOCs
    yaxis_id: vocs
    color: "#f1c40f"
yaxis:
  - id: co2
    show: true
    opposite: false
    decimals: 0
  - id: pm25
    show: true
    opposite: false
    decimals: 1
  - id: vocs
    show: true
    opposite: true
    decimals: 0
